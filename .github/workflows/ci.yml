name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Shared design files are in sync (site + app)
        run: node tools/sync-shared.mjs --check
      - name: Website link codec matches the shared test vectors
        run: node tools/test-linkcodec.mjs

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.7, channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
